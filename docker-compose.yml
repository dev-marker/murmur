services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: murmur
      POSTGRES_PASSWORD: murmur
      POSTGRES_DB: murmur
    # one extra module: it counts what every statement costs, and it has to be loaded at startup
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements",
              "-c", "pg_stat_statements.track_planning=on"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/primary.sh:/docker-entrypoint-initdb.d/primary.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murmur"]
      interval: 2s
      timeout: 2s
      retries: 15

  # a copy of the database that follows the primary, for reads that may be a moment old
  replica:
    image: postgres:17-alpine
    entrypoint: ["sh", "/replica.sh"]
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements",
              "-c", "pg_stat_statements.track_planning=on", "-c", "wal_receiver_status_interval=1s"]
    volumes:
      - replicadata:/var/lib/postgresql/data
      - ./deploy/replica.sh:/replica.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murmur"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10m

  # a cache: everything in it can be rebuilt from Postgres, so nothing is saved to disk
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # our own code: two API servers, from one image
  api:
    build: .
    image: murmur
    deploy:
      replicas: ${API:-2}
    environment:
      DATABASE_URL: postgres://murmur:murmur@postgres:5432/murmur?sslmode=disable&connect_timeout=5
      REPLICA_URL: postgres://murmur:murmur@replica:5432/murmur?sslmode=disable&connect_timeout=5
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXIES: 172.30.0.0/24
      IP_PER_MINUTE: ${IP_PER_MINUTE:-3000}
      IP_BURST: ${IP_BURST:-100}
    depends_on:
      postgres:
        condition: service_healthy
      replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "ready"]
      interval: 2s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 15s

  # and the worker, from the same image. The API runs the migrations, so it goes first
  worker:
    image: murmur
    entrypoint: ["/worker"]
    deploy:
      replicas: ${WORKER:-1}
    environment:
      DATABASE_URL: postgres://murmur:murmur@postgres:5432/murmur?sslmode=disable&connect_timeout=5
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/worker", "ready"]
      interval: 2s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 25s

  # the load balancer: one door for every client, and the API servers behind it
  nginx:
    image: nginx:1.30.7
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

  # metrics: Prometheus asks every process for its numbers, and keeps them
  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 15

  # dashboards. Nobody logs in, and everybody may edit: for a laptop, never for a server
  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  # load tests: docker compose run --rm k6 run /load/feed.js
  k6:
    image: grafana/k6:2.4.0
    profiles: [load]
    volumes:
      - ./load:/load
    environment:
      BASE_URL: http://nginx:8080

# one network for everything in this file, with a range of addresses that we choose
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  promdata:
  replicadata:
