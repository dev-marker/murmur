# The load balancer. Clients talk to port 8080, and nginx hands every request
# to one of the API servers.
events {}

http {
    # no line per request: one load test would write a hundred thousand of them
    access_log off;

    # The API servers. They run on this machine, outside Docker.
    upstream api {
        server host.docker.internal:8081;
        server host.docker.internal:8082;
        keepalive 256;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Served-By $upstream_addr always;
        }
    }
}
