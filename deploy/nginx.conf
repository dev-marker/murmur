# The load balancer. Clients talk to port 8080, and nginx hands every request
# to one of the API servers.
events {
    # a stream holds two connections
    worker_connections 8192;
}

http {
    # no line per request: one load test would write a hundred thousand of them
    access_log off;

    # The API servers. Docker's DNS answers the name api with the address of every
    # container of that service, and nginx asks it again every five seconds.
    upstream api {
        # the list of servers lives in shared memory, so it can change while nginx runs
        zone api 64k;
        # Docker's DNS, asked again every five seconds
        resolver 127.0.0.11 valid=5s;
        # max_fails=0: a server that refused a connection is tried again on the next request
        server api:8081 resolve max_fails=0;
        keepalive 256;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://api;
            # a server that is gone doesn't refuse: nobody answers. Wait a second, not a minute
            proxy_connect_timeout 1s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Served-By $upstream_addr always;
        }
    }

    # The web app: what make web built, and the API under /api/, on one
    # address. So the browser never calls another origin, and needs no CORS.
    server {
        listen 8088;
        root /srv/web;
        # the types of files by their names: a browser runs no .js sent as text
        include /etc/nginx/mime.types;
        # the build's JavaScript and CSS go out compressed
        gzip on;
        gzip_types text/css application/javascript;

        # an address the app routes itself, like /u/user1, gets the app
        location / {
            try_files $uri /index.html =404;
            # its name never changes, so the browser asks again every time
            add_header Cache-Control "no-cache";
        }

        # their names change with their content, so they can be kept for good
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # /api/feed is /feed to the API servers
        location /api/ {
            proxy_pass http://api/;
            proxy_connect_timeout 1s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Served-By $upstream_addr always;
        }
    }
}
