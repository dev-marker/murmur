# Who Prometheus asks for numbers, and how often.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 9081
        refresh_interval: 5s
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101
        refresh_interval: 5s
